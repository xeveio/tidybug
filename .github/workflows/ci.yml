name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # Runs each suite on its own under a hard 2-minute cap with live output,
      # so a hung suite is killed and named instead of eating the job timeout.
      - name: Core tests
        timeout-minutes: 25
        run: scripts/ci-test.sh

      - name: Build app (unsigned)
        timeout-minutes: 15
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -project TidyBug.xcodeproj -scheme TidyBug -configuration Debug \
            -derivedDataPath build/DD CODE_SIGNING_ALLOWED=NO build
