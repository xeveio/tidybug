name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # Every suite has a 1-minute time limit, so a hang fails with the
      # test's name instead of silently eating the job timeout.
      - name: Core tests
        working-directory: Packages/TidyBugCore
        timeout-minutes: 10
        run: swift test

      - name: Build app (unsigned)
        timeout-minutes: 15
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -project TidyBug.xcodeproj -scheme TidyBug -configuration Debug \
            -derivedDataPath build/DD CODE_SIGNING_ALLOWED=NO build
