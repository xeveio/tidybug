name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Core tests
        working-directory: Packages/TidyBugCore
        run: swift test

      - name: Build app (unsigned)
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -project TidyBug.xcodeproj -scheme TidyBug -configuration Debug \
            -derivedDataPath build/DD CODE_SIGNING_ALLOWED=NO build
